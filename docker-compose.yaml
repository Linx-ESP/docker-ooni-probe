services:
  ooniprobe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ooniprobe
    environment:
      - TZ=Europe/Madrid
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - ooni-net
    mem_limit: 128m

networks:
  ooni-net:
    enable_ipv6: true
